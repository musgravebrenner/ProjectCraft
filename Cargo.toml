[package]
name = "plancraft"
version = "0.1.0"
edition = "2021"
default-run = "plancraft"
description = "A project scheduling desktop app where every action is a command: GUI, CLI, JSON control channel and MCP server share one registry."

[lib]
name = "plancraft"
path = "src/lib.rs"

[[bin]]
name = "plancraft"
path = "src/main.rs"

[[bin]]
name = "plancraft-cli"
path = "src/bin/plancraft-cli.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.31"
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
cfb = "0.10"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
